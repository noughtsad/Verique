<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verique</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="../icons/icon32.png" width="22" height="22" alt="">
    <strong>Verique</strong>
    <span class="spacer"></span>
    <span class="status" id="api-status" title="">
      <span class="dot"></span><span class="status-text">Checking API…</span>
    </span>
  </header>

  <main>
    <section>
      <h2>This page</h2>
      <div class="actions">
        <button id="check-page" class="btn primary">Check this page</button>
        <button id="check-selection" class="btn">Check selected text</button>
      </div>
      <p id="page-hint" class="hint" hidden></p>
    </section>

    <section>
      <h2>Check any text</h2>
      <textarea id="text-input" rows="4" placeholder="Paste a paragraph or a claim…"></textarea>
      <button id="check-text" class="btn">Check text</button>
    </section>

    <section id="job" aria-live="polite" hidden></section>

    <details id="settings">
      <summary>Settings</summary>
      <form id="settings-form">
        <label>API URL
          <input id="api-base" type="url" required placeholder="http://localhost:8000">
        </label>
        <label>Web app URL
          <input id="app-url" type="url" required placeholder="http://localhost:3000">
        </label>
        <div class="row">
          <button type="submit" class="btn small">Save</button>
          <button type="button" id="reset-settings" class="btn small ghost">Reset</button>
          <span id="settings-msg" class="hint"></span>
        </div>
      </form>
    </details>
  </main>

  <footer>
    <a id="open-app" href="#" target="_blank" rel="noopener">Open Verique</a>
    <span class="hint">Alt+Shift+V checks the page</span>
  </footer>

  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
